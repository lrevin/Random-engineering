# 깃허브에 올릴 때마다 자동으로 앱 검사와 데이터 검사를 돌린다 (GitHub Actions)
# 결과: 저장소 → Actions 탭 (초록 ✔ 통과 / 빨간 ✘ 실패)
name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  app:
    name: 앱 타입·코드 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 타입 검사 (TypeScript)
        run: npx tsc --noEmit
      - name: 코드 규칙 검사 (ESLint)
        run: npx expo lint

  data:
    name: 주제·퀴즈 데이터 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 퀴즈 문제 은행 형식 검사
        run: python scripts/quizbank.py check
      - name: 서버 함수용 주제 목록이 앱 데이터와 같은지 확인
        run: |
          python scripts/export_topics.py
          git diff --exit-code api/supabase/functions/generate-quiz/topics.json
